<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeppyCash - Password Reset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap" rel="stylesheet">
<style>
  :root {
      /* Type: Figtree is the display face (titles, hero numbers, money);
         body copy stays on the platform font, matching the app. */
      --font-display: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: #FFFFFF;
      color: #15201A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #F1F3EE;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo { font-size: 56px; margin-bottom: 16px; }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #15201A;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #5D6A62;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #5D6A62;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E2E6DE;
      border-radius: 12px;
      background: #F1F3EE;
      color: #15201A;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: rgba(30,90,62, 0.4);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: #1E5A3E;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background: rgba(35,122,75, 0.2);
      color: #237A4B;
      border: 1px solid rgba(35,122,75, 0.4);
    }

    .message.error {
      background: rgba(176,68,44, 0.2);
      color: #B0442C;
      border: 1px solid rgba(176,68,44, 0.4);
    }

    .hidden {
      display: none;
    }
  
    /* Figtree display face */
    .logo, h1 { font-family: var(--font-display); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💰</div>
    <h1>KeepyCash</h1>
    <!-- Request Reset Form -->
    <div id="request-form" class="hidden">
      <h1>Reset Password</h1>
      <p class="subtitle">Enter your email to receive a password reset link</p>

      <form id="reset-email-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <button type="submit" id="submit-btn">Send Reset Link</button>
      </form>

      <div id="message" class="message"></div>
    </div>

    <!-- Change Password Form -->
    <div id="change-form" class="hidden">
      <h1>Set New Password</h1>
      <p class="subtitle">Enter your new password</p>

      <form id="change-password-form">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" required minlength="8" />
        </div>
        <div class="form-group">
          <label for="password-confirm">Confirm Password</label>
          <input type="password" id="password-confirm" required minlength="8" />
        </div>
        <button type="submit" id="change-btn">Update Password</button>
      </form>

      <div id="change-message" class="message"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://nwdiwonrskdluigqwjbm.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_WctlTXMnpCSW_i0LuStx9g_fq4atrcG'
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    function showRequestForm() {
      document.getElementById('request-form').classList.remove('hidden')
      document.getElementById('change-form').classList.add('hidden')
    }

    function showChangeForm() {
      document.getElementById('request-form').classList.add('hidden')
      document.getElementById('change-form').classList.remove('hidden')
    }

    // PASSWORD_RECOVERY fires once Supabase finishes processing the hash token.
    // getSession() races against that async work and loses on iOS Safari.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        showChangeForm()
      }
    })

    // Fallback: show request form if no auth event arrives within 500ms
    setTimeout(async () => {
      const { data } = await supabaseClient.auth.getSession()
      if (!data.session) showRequestForm()
    }, 500)

    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId)
      el.textContent = message
      el.className = `message ${type}`
      el.style.display = 'block'
    }

    // Handle password reset request
    document.getElementById('reset-email-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = document.getElementById('email').value
      const submitBtn = document.getElementById('submit-btn')

      submitBtn.disabled = true
      try {
        await supabaseClient.auth.resetPasswordForEmail(email)
        showMessage('message', 'Check your email for the reset link', 'success')
        document.getElementById('email').value = ''
      } catch (error) {
        showMessage('message', error.message || 'Error sending reset link', 'error')
      } finally {
        submitBtn.disabled = false
      }
    })

    // Handle password change
    document.getElementById('change-password-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const password = document.getElementById('password').value
      const passwordConfirm = document.getElementById('password-confirm').value

      if (password !== passwordConfirm) {
        showMessage('change-message', 'Passwords do not match', 'error')
        return
      }

      const changeBtn = document.getElementById('change-btn')
      changeBtn.disabled = true

      try {
        await supabaseClient.auth.updateUser({ password })
        showMessage('change-message', 'Password updated successfully! Redirecting...', 'success')
        setTimeout(() => window.location.href = '/auth/callback', 2000)
      } catch (error) {
        showMessage('change-message', error.message || 'Error updating password', 'error')
      } finally {
        changeBtn.disabled = false
      }
    })

  </script>
</body>
</html>
