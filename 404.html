<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #FFFFFF;
    color: #333333;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
    text-align: center;
  }
  .wordmark {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #007AFF;
    margin-bottom: 40px;
  }
  .headline {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.15;
    max-width: 360px;
    margin-bottom: 12px;
  }
  .sub {
    font-size: 16px;
    line-height: 1.6;
    color: #666666;
    max-width: 320px;
    margin-bottom: 32px;
  }
  .code-box {
    background: #F5F5F5;
    border: 1.5px solid #E0E0E0;
    border-radius: 16px;
    padding: 20px 28px;
    margin-bottom: 12px;
    width: 100%;
    max-width: 320px;
  }
  .code-label {
    font-size: 12px;
    color: #999999;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .code {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #333333;
  }
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 32px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1.5px solid #E0E0E0;
    background: #FFFFFF;
    color: #333333;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .copy-btn:active { transform: scale(0.97); }
  #content {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 360px;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 28px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-decoration: none;
    transition: opacity 0.15s, transform 0.1s;
    border: none;
    cursor: pointer;
  }
  .btn:active { transform: scale(0.97); }
  .btn-apple {
    background: #333333;
    color: #FFFFFF;
  }
  .btn-android {
    background: #F0F0F0;
    color: #333333;
    border: 1.5px solid #E0E0E0;
  }
  .btn-open {
    background: #FFFFFF;
    color: #007AFF;
    border: 1.5px solid #007AFF;
  }
  .btn-home {
    background: #F0F0F0;
    color: #333333;
    border: 1.5px solid #E0E0E0;
  }
  .btn svg { flex-shrink: 0; }
  footer {
    position: fixed;
    bottom: 24px;
    font-size: 12px;
    color: #999999;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

<div class="wordmark">KeepyCash</div>

<div id="content"></div>

<footer>keepycash.com</footer>

<script>
  const IOS_URL = 'https://apps.apple.com/us/app/keepycash-budget-planner/id6760102114';
  const ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.jpredman27.keepycash';

  const APPLE_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>';
  const ANDROID_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.341l1.092 1.891a.5.5 0 0 1-.183.683.5.5 0 0 1-.683-.183l-1.108-1.918A6.97 6.97 0 0 1 12 17a6.97 6.97 0 0 1-4.641-1.186L6.251 17.732a.5.5 0 0 1-.866-.5l1.092-1.891A6.994 6.994 0 0 1 5 10h14a6.994 6.994 0 0 1-1.477 5.341zM8.5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm7 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM3.305 8.553l-1.86-3.22a.5.5 0 0 1 .866-.5l1.883 3.26A7.018 7.018 0 0 1 12 6a7.018 7.018 0 0 1 7.806 2.093l1.883-3.26a.5.5 0 1 1 .866.5l-1.86 3.22A6.973 6.973 0 0 1 22 10H2a6.973 6.973 0 0 1 1.305-1.447z"/></svg>';

  function appleBtn() {
    return '<a class="btn btn-apple" href="' + IOS_URL + '">' + APPLE_SVG + 'Download on the App Store</a>';
  }
  function androidBtn() {
    return '<a class="btn btn-android" href="' + ANDROID_URL + '">' + ANDROID_SVG + 'Get it on Google Play</a>';
  }

  function storeButtons() {
    const isAndroid = /Android/i.test(navigator.userAgent);
    return isAndroid ? (androidBtn() + appleBtn()) : (appleBtn() + androidBtn());
  }

  function getRawCode() {
    const match = window.location.pathname.match(/^\/c\/([^\/]*)\/?$/i);
    return match ? match[1] : null;
  }

  function isValidCode(code) {
    return /^[A-Za-z0-9]{3,20}$/.test(code);
  }

  function render() {
    const container = document.getElementById('content');
    const raw = getRawCode();

    // Not a /c/ link: plain not-found page.
    if (raw === null) {
      document.title = 'Page not found';
      container.innerHTML =
        '<h1 class="headline">Page not found</h1>' +
        '<p class="sub">That page does not exist.</p>' +
        '<div class="buttons"><a class="btn btn-home" href="https://keepycash.com/">Go to keepycash.com</a></div>';
      return;
    }

    if (!isValidCode(raw)) {
      container.innerHTML =
        '<h1 class="headline">Missing creator code</h1>' +
        '<p class="sub">This link is missing a valid code. Ask the creator for their code, or download KeepyCash below.</p>' +
        '<div class="buttons">' + storeButtons() + '</div>';
      return;
    }

    const code = raw.toUpperCase();
    document.title = code + ' code for KeepyCash';

    container.innerHTML =
      '<h1 class="headline">' + code + '’s code for KeepyCash</h1>' +
      '<p class="sub">Download KeepyCash, then enter this code when you create your account.</p>' +
      '<div class="code-box"><div class="code-label">Creator code</div><div class="code">' + code + '</div></div>' +
      '<button class="copy-btn" id="copy-btn">Copy code</button>' +
      '<div class="buttons">' +
        storeButtons() +
        '<a class="btn btn-open" href="https://keepycash.com/c/' + raw + '">Open in the app</a>' +
      '</div>';

    document.getElementById('copy-btn').addEventListener('click', function () {
      const btn = this;
      const done = function () {
        btn.textContent = 'Copied';
        setTimeout(function () { btn.textContent = 'Copy code'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done).catch(done);
      } else {
        const el = document.createElement('textarea');
        el.value = code;
        document.body.appendChild(el);
        el.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(el);
        done();
      }
    });
  }

  render();
</script>
</body>
</html>
