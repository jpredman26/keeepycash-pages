<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeepyCash — Opening app…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap" rel="stylesheet">
<style>
  :root {
      /* Type: Figtree is the display face (titles, hero numbers, money);
         body copy stays on the platform font, matching the app. */
      --font-display: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: var(--font-body);
            background: #FFFFFF;
            color: #15201A;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 24px;
            text-align: center;
        }
        .wordmark {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #1E5A3E;
            margin-bottom: 24px;
        }
        p.status {
            font-size: 15px;
            color: #5D6A62;
            margin-bottom: 32px;
        }
        .download-prompt {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 300px;
        }
        .download-prompt.visible { display: flex; }
        .download-prompt .sub {
            font-size: 14px;
            color: #5D6A62;
            margin-bottom: 4px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.01em;
            text-decoration: none;
            transition: opacity 0.15s, transform 0.1s;
            border: none;
            cursor: pointer;
            background: #1E5A3E;
            color: #FFFFFF;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.97); }
    
    /* Figtree display face */
    .wordmark { font-family: var(--font-display); }
  </style>
</head>
<body>

<div class="wordmark">KeepyCash</div>
<p class="status" id="status">Opening KeepyCash…</p>

<div class="download-prompt" id="download-prompt">
    <p class="sub">Didn't open automatically? Get the app.</p>
    <a class="btn" href="/download.html">Download now</a>
</div>

<script>
    // Generic deep-link launcher.
    //
    // https://keepycash.com/app/?screen=goal&id=123
    //   -> keepycash://goal?id=123
    //
    // `screen` selects the in-app destination (custom-scheme "host");
    // every other query param, plus any hash fragment, is forwarded as-is.
    var params = new URLSearchParams(window.location.search);
    var screen = params.get('screen') || 'signin';
    params.delete('screen');

    var query = params.toString();
    var hash = window.location.hash;
    var deepLink = 'keepycash://' + screen + (query ? '?' + query : '') + hash;
    window.location.replace(deepLink);

    // If the deep link doesn't take (app not installed, or the user
    // cancels the "Open in KeepyCash?" prompt), the browser stays on
    // this page — show a fallback to the download page after a beat.
    setTimeout(function () {
        document.getElementById('status').textContent = "Didn't work?";
        document.getElementById('download-prompt').classList.add('visible');
    }, 2000);
</script>
</body>
</html>
